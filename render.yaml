services:
  - type: web
    name: dz-bot-proxy
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: FALLBACK_BASE_URL
        sync: false
      - key: FALLBACK_API_KEY
        sync: false
      - key: FALLBACK_MODEL
        sync: false
      - key: RATE_PER_HOUR
        value: "30"
      - key: RATE_PER_DAY
        value: "200"
      - key: PING_URL
        sync: false
